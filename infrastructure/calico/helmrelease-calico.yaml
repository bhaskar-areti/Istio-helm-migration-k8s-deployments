apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tigera-operator
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: tigera-operator
      version: "v3.32.0" # Use the specific clean version you want
      sourceRef:
        kind: HelmRepository
        name: projectcalico
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace